version: '3.8'

services:
  # MongoDB
  mongodb:
    image: mongo:7.0
    container_name: conq-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: password
      MONGO_INITDB_DATABASE: conq
    volumes:
      - mongodb_data:/data/db
    networks:
      - conq-network

  # MongoDB Express (Web UI)
  mongo-express:
    image: mongo-express:latest
    container_name: conq-mongo-express
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: admin
      ME_CONFIG_MONGODB_ADMINPASSWORD: password
      ME_CONFIG_MONGODB_URL: mongodb://admin:password@mongodb:27017/
      ME_CONFIG_BASICAUTH_USERNAME: admin
      ME_CONFIG_BASICAUTH_PASSWORD: password
    depends_on:
      - mongodb
    networks:
      - conq-network

  # Redis
  redis:
    image: redis:7-alpine
    container_name: conq-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    networks:
      - conq-network

  # NATS
  nats:
    image: nats:latest
    container_name: conq-nats
    restart: unless-stopped
    ports:
      - "4222:4222"  # Client connections
      - "8222:8222"  # HTTP monitoring
      - "6222:6222"  # Cluster connections
    command: ["--http_port", "8222", "--jetstream"]
    volumes:
      - nats_data:/data
    networks:
      - conq-network

  # MinIO (S3-compatible object storage)
  minio:
    image: minio/minio:latest
    container_name: conq-minio
    restart: unless-stopped
    ports:
      - "9000:9000"  # API
      - "9001:9001"  # Console
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    networks:
      - conq-network

volumes:
  mongodb_data:
    driver: local
  redis_data:
    driver: local
  nats_data:
    driver: local
  minio_data:
    driver: local

networks:
  conq-network:
    driver: bridge
