syntax = "proto3";

package conq;

option go_package = "github.com/conq/backend/shared/proto;proto";

// Common message types

message User {
  string id = 1;
  string email = 2;
  string name = 3;
  string role = 4;
  int64 created_at = 5;
  int64 updated_at = 6;
}

message Content {
  string id = 1;
  string user_id = 2;
  string title = 3;
  string body = 4;
  repeated string media_urls = 5;
  repeated string tags = 6;
  string status = 7;  // draft, pending, approved, published
  repeated string platforms = 8;
  int64 created_at = 9;
  int64 updated_at = 10;
}

message Schedule {
  string id = 1;
  string content_id = 2;
  string account_id = 3;
  int64 scheduled_time = 4;
  string timezone = 5;
  string status = 6;  // pending, processing, completed, failed
  int32 retry_count = 7;
  int64 created_at = 8;
}

message Media {
  string id = 1;
  string user_id = 2;
  string filename = 3;
  string storage_key = 4;
  string mime_type = 5;
  int64 size_bytes = 6;
  string thumbnail_url = 7;
  int64 created_at = 8;
}

// Common request/response patterns

message Empty {}

message Status {
  bool success = 1;
  string message = 2;
  int32 code = 3;
}

message Pagination {
  int32 page = 1;
  int32 limit = 2;
  int64 total = 3;
}
